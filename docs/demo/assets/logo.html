<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&display=swap">
<style>
  html,body{margin:0;padding:0;background:transparent;}
  .tile{
    width:512px;height:512px;
    background:#0b0e17;
    border-radius:116px;
    display:flex;flex-direction:column;justify-content:center;gap:36px;
    padding:0 96px;
    box-sizing:border-box;
  }
  .bar{height:52px;border-radius:26px;background:#232942;position:relative;overflow:hidden;}
  .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:26px;background:#7c7cf2;display:block;}
</style>
<div class="tile">
  <div class="bar"><i style="width:72%"></i></div>
  <div class="bar"><i style="width:38%"></i></div>
  <div class="bar"><i style="width:56%"></i></div>
</div>
